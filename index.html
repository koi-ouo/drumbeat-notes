<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>舞獅鼓點筆記</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6efe2;--bg2:#efe3cd;--card:#fffaf0;--fg:#2b1a14;--mut:#8a7565;--line:#dccdb5;--red:#b3261e;--gold:#a87a12;--drum:#b3261e;--cym:#a87a12;--hl:rgba(179,38,30,.13);--glow:rgba(179,38,30,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150a0b;--bg2:#2a0f10;--card:#1f1112;--fg:#f5e9d6;--mut:#a38f7c;--line:#3d2625;--red:#e0463a;--gold:#e8b84a;--drum:#ff5a4a;--cym:#f0c24f;--hl:rgba(240,194,79,.14);--glow:rgba(240,194,79,.5)}}
:root[data-theme="dark"]{--bg:#150a0b;--bg2:#2a0f10;--card:#1f1112;--fg:#f5e9d6;--mut:#a38f7c;--line:#3d2625;--red:#e0463a;--gold:#e8b84a;--drum:#ff5a4a;--cym:#f0c24f;--hl:rgba(240,194,79,.14);--glow:rgba(240,194,79,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 400px at 50% -80px,var(--bg2),var(--bg));background-color:var(--bg);color:var(--fg);font-family:system-ui,"PingFang HK","Noto Sans TC",sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:20px 14px 110px}
header{text-align:center;padding:18px 0 14px}
h1{margin:0;font-family:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;font-size:2.4rem;letter-spacing:.35em;text-indent:.35em;background:linear-gradient(180deg,var(--gold),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
header small{display:block;letter-spacing:.5em;font-size:.65rem;color:var(--mut);margin-top:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:14px 0}
button,select,input,textarea{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
button{cursor:pointer;transition:.15s}
button:hover{border-color:var(--gold)}
.chip.a{background:linear-gradient(135deg,var(--red),#7d1710);border-color:transparent;color:#fff;box-shadow:0 2px 14px var(--glow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.title h2{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:1.6rem}
.meta{color:var(--mut);font-size:.85rem;letter-spacing:.08em}
.sys{display:grid;grid-template-columns:2.6rem repeat(var(--n),1fr);margin-bottom:22px;scroll-margin:40vh}
.bh{grid-row:1;font-size:.7rem;color:var(--gold);letter-spacing:.2em;padding:0 0 4px 6px;border-left:2px solid var(--gold);align-self:end}
.sl{font-size:.68rem;color:var(--mut);text-align:center;border-left:1px solid transparent;padding-bottom:2px}
.sl.bt{color:var(--fg);font-weight:600;font-size:.8rem}
.lab{display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;font-weight:700;color:var(--mut);border-top:1px solid var(--line)}
.lab.dr{color:var(--drum)}.lab.cy{color:var(--cym)}
.c{display:flex;align-items:center;justify-content:center;height:2.7rem;border-top:1px solid var(--line);cursor:pointer;user-select:none;position:relative}
.c.t-drum{color:var(--drum)}.c.t-cym{color:var(--cym)}
.c.bs{border-left:2px solid var(--gold)}
.c.bt{border-left:1px solid var(--line)}
.c:empty::after{content:"";width:3px;height:3px;border-radius:50%;background:var(--line)}
.c svg{width:62%;max-width:24px;height:auto;transition:transform .12s,filter .12s}
.c.on{background:var(--hl)}
.c.on svg{transform:scale(1.4);filter:drop-shadow(0 0 7px currentColor)}
.sl.on{color:var(--gold)}
body.view .c{cursor:default}
body.view .eo{display:none!important}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
.leg span{display:flex;align-items:center;gap:6px}.leg svg{width:16px}
#tp{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:9}
#tp .in{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#play{width:52px;height:52px;border-radius:50%;padding:0;font-size:1.2rem;color:#fff;background:linear-gradient(135deg,var(--red),#7d1710);border:none;box-shadow:0 0 18px var(--glow)}
.tg{display:flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.tg input{display:none}.tg i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.tg input:checked+i{background:currentColor;box-shadow:0 0 8px currentColor}
.tg.dr{color:var(--drum)}.tg.cy{color:var(--cym)}.tg span{color:var(--fg)}
input[type=range]{accent-color:var(--red);padding:0;border:none;width:130px}
input[type=number]{width:4.4rem;border-radius:8px}
.st{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.st label{font-size:.85rem;color:var(--mut)}
textarea{width:100%;box-sizing:border-box;border-radius:10px}
#note{color:var(--mut);font-size:.9rem;margin:0 0 12px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;width:min(560px,92vw)}

.part{margin-bottom:18px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph h3{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:1.35rem}
.ph .no{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.pl{box-shadow:0 0 0 1px var(--gold),0 0 22px var(--glow)}
.mini{padding:3px 11px;font-size:.85rem}
.kh{display:flex;align-items:center;gap:8px;margin:2px 0 4px;font-family:"Noto Serif TC",serif;color:var(--gold);font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:2px}
.kh b{cursor:default}
body:not(.view) .kh b{cursor:pointer;border-bottom:1px dashed var(--gold)}
body.cutting .c{cursor:crosshair}
.c.bs{border-left:2px solid var(--gold)}
.sys{margin-bottom:6px}
.sc{font-size:.8rem;color:var(--mut)}
.on-cut{background:var(--gold);color:#fff;border-color:var(--gold)}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);padding:8px 0;margin-bottom:10px}
.trow{display:flex;gap:8px;align-items:center}
#tabs{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px}
#tabs button{white-space:nowrap;flex:none}
#etb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
#hint{font-size:.8rem;color:var(--gold)}
.kn{background:var(--hl);border-left:3px solid var(--gold);padding:6px 10px;border-radius:6px;margin:8px 0 4px;font-size:.9rem;white-space:pre-wrap}
.pn{margin:0 0 10px;color:var(--mut);font-size:.9rem}
.c svg.roll{width:100%;max-width:none;height:20px}
.c.on svg.roll{transform:scaleY(1.5)}
body.view .kn{cursor:default}
.leg{margin-bottom:14px}.leg i svg{width:16px;height:16px}
dialog input,dialog textarea{border-radius:10px}
.nrow{display:grid;grid-template-columns:2.6rem repeat(var(--n),1fr);row-gap:3px;margin-top:8px}
.nt{background:var(--hl);border-left:3px solid var(--gold);font-size:.8rem;padding:2px 6px;border-radius:4px;min-width:0;line-height:1.3}
.bh{padding-left:6px;color:var(--gold);font-size:.78rem;letter-spacing:.05em;margin-top:6px}
body:not(.view) .bh,body:not(.view) .nt,body:not(.view) .kn{cursor:pointer}
#pal{display:inline-flex;gap:6px;align-items:center}
.pb{width:36px;height:36px;padding:5px;border-radius:10px;color:var(--drum)}.pb.t-cym{color:var(--cym)}
.pb.sel{border-color:currentColor;background:var(--hl);box-shadow:0 0 8px currentColor}.pb svg{width:100%;height:100%}
.dy{padding:3px 10px;font-size:.8rem}.dy.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
#pal{flex-wrap:wrap}
.c.v-s svg{opacity:.5}
.pc{height:2.7rem;border-top:1px solid var(--line);background:color-mix(in srgb,var(--line) 40%,transparent);opacity:.55;border-radius:0 6px 6px 0}
</style></head><body>
<main>
<header><h1>舞獅鼓點筆記</h1><small>DRUM CYMBAL NOTES</small></header>
<div id="top">
 <div class="trow"><div id="tabs"></div><button id="mode">✎ 編輯</button></div>
 <div class="eo" id="etb"><button id="addpart">＋ 新增部分</button><button id="cut">✂ 分楷</button><button id="sec">⋯ 段落設定</button><span id="pal"></span><span id="hint"></span></div>
</div>
<div class="leg"><span style="color:var(--drum)"><i data-s="X"></i>鼓邊</span><span style="color:var(--drum)"><i data-s="●"></i>鼓心</span><span style="color:var(--drum)"><i data-s="≈"></i>擂鼓</span><span style="color:var(--cym)"><i data-s="◎"></i>開音</span><span style="color:var(--cym)"><i data-s="○"></i>按音</span><span style="opacity:.8">虛線＋較暗＝小聲</span></div>
<div id="parts"></div>
</main>
<div id="tp"><div class="in">
 <button id="play" aria-label="播放整段">▶</button>
 <label class="tg"><input type="checkbox" id="loop" checked><i></i><span>循環</span></label>
 <label class="tg dr"><input type="checkbox" data-tr="drum" checked><i></i><span>鼓</span></label>
 <label class="tg cy"><input type="checkbox" data-tr="cym" checked><i></i><span>鈸</span></label>
 <label style="font-size:.85rem;color:var(--mut)">速度 <input type="range" id="spd" min="40" max="150" value="100"> <b id="spdv" style="color:var(--fg)">100%</b></label>
</div></div>

let ctx,nbuf,vm=1;
function A(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ctx.state==='suspended')ctx.resume();return ctx}
function noise(t,ty,f,q,g,d){const s=ctx.createBufferSource();s.buffer=nbuf;const fl=ctx.createBiquadFilter();fl.type=ty;fl.frequency.value=f;fl.Q.value=q;const v=ctx.createGain();v.gain.setValueAtTime(g*vm,t);v.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(v);v.connect(ctx.destination);s.start(t);s.stop(t+d+.05)}
function tone(t,f0,f1,g,d,ty){const o=ctx.createOscillator();o.type=ty||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d*.6);const v=ctx.createGain();v.gain.setValueAtTime(g*vm,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(ctx.destination);o.start(t);o.stop(t+d+.05)}
function hit(y,t,d,vol){vm=vol||1;
 if(y==='≈'){d=d||.12;const k=Math.max(2,Math.round(d/.06));for(let i=0;i<k;i++){const tt=t+i*d/k;tone(tt,150,65,.5,.14);noise(tt,'lowpass',500,1,.15,.05)}return}
 if(y==='●'){tone(t,170,55,1,.45);noise(t,'lowpass',600,1,.3,.1)}
 else if(y==='X'){noise(t,'highpass',2500,1,.7,.07);tone(t,420,300,.35,.08,'triangle')}
 else if(y==='◎'){noise(t,'bandpass',5500,.7,.6,1.3);[3100,4300,5200].forEach(f=>tone(t,f,f*.98,.08,1.1,'square'))}
 else if(y==='○'){noise(t,'bandpass',4200,.8,.6,.12)}}

/* scheduler：播放清單由多個 {p,a,b}（部分、起格、終格）組成 */
let timer,raf,list,li,nS,nT,q=[],endT=null,lastRow=null;
const spd=()=>$('#spd').value/100;
function sched(){
 while(nT<ctx.currentTime+.12&&endT===null){
  const g=list[li],p=S().parts[g.p];
  TR.forEach(t=>{const y=p[t.id][nS];if(y&&on[t.id])hit(y,nT,60/(p.bpm*spd())/p.sub,VOLS[p.dyn[t.id][nS]||'n'])});
  q.push({p:g.p,s:nS,t:nT});nT+=60/(p.bpm*spd())/p.sub;nS++;
  if(nS>=g.b){li++;if(li>=list.length){if($('#loop').checked)li=0;else{endT=nT;break}}nS=list[li].a}}
 if(endT!==null&&ctx.currentTime>=endT)stop()}
function frame(){let m=null;while(q.length&&q[0].t<=ctx.currentTime)m=q.shift();if(m)mark(m.p,m.s);if(playing)raf=requestAnimationFrame(frame)}
function mark(p,s){unmark();const cs=$$('[data-p="'+p+'"][data-s="'+s+'"]');cs.forEach(c=>c.classList.add('on'));
 const card=$$('.part')[p];if(card)card.classList.add('pl');
 const row=cs[0]&&cs[0].closest('.sys');if(row&&row!==lastRow){lastRow=row;row.scrollIntoView({behavior:'smooth',block:'center'})}}
function unmark(){$$('.on').forEach(c=>c.classList.remove('on'));$$('.pl').forEach(c=>c.classList.remove('pl'))}
function go(l){stop();A();list=l;li=0;nS=l[0].a;playing=true;nT=ctx.currentTime+.08;endT=null;q=[];lastRow=null;timer=setInterval(sched,25);sched();raf=requestAnimationFrame(frame);$('#play').textContent='■'}
function stop(){playing=false;clearInterval(timer);cancelAnimationFrame(raf);q=[];unmark();$('#play').textContent='▶'}
